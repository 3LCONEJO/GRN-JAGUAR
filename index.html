<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JAGUAR · CCAN Explorer</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root,body{--bg:#faf9f7;--panel:#fff;--panel2:#fbfaf8;--panelGlass:rgba(255,255,255,.92);--border:#e9e5e0;--border2:#e0dbd4;--track:#f0ede8;--chipBg:#f4f1ed;--hoverbg:#f7f5f2;--text:#1c1917;--text2:#44403c;--sub:#78716c;--sub2:#57534e;--faint:#a8a29e;--accent:#900ccf;--accentBg:#f6edfc;--accentBorder:#ecd9f8;--lblL:0.44;--inputBg:#faf9f7;--thumb:#ddd8d2}
body.dark{--bg:#17151a;--panel:#211e26;--panel2:#26222e;--panelGlass:rgba(33,30,38,.92);--border:#36303f;--border2:#443d52;--track:#2e2a38;--chipBg:#2e2a38;--hoverbg:#2b2735;--text:#f0edf4;--text2:#d9d4e3;--sub:#a49db3;--sub2:#b8b1c6;--faint:#7c7590;--accent:#c77dff;--accentBg:#3a2350;--accentBorder:#57337a;--lblL:0.78;--inputBg:#1c1922;--thumb:#443d52}
body{margin:0;background:var(--bg);font-family:'Instrument Sans',system-ui,sans-serif;color:var(--text);overflow:hidden}
a{color:var(--accent);text-decoration:none}a:hover{color:#d83f4d}
button{font:inherit;cursor:pointer}
@keyframes cardIn{from{opacity:0;transform:translateY(12px) scale(.98)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-thumb{background:var(--thumb);border-radius:4px}
input::placeholder{color:var(--faint)}
.app{height:100vh;display:grid;grid-template-rows:60px 1fr;grid-template-columns:250px 1fr;transition:grid-template-columns .35s cubic-bezier(.22,1,.36,1);overflow:hidden}
.app.closed{grid-template-columns:0px 1fr}
header{grid-column:1/-1;display:flex;align-items:center;gap:16px;padding:0 20px;background:var(--panel);border-bottom:1px solid var(--border);position:relative;z-index:30}
.iconbtn{border:1px solid var(--border2);background:var(--panel);color:var(--sub);border-radius:8px;width:30px;height:30px;display:flex;align-items:center;justify-content:center;flex:none;padding:0;font-size:14px;line-height:1}
.iconbtn:hover{border-color:var(--accentBorder);color:var(--accent)}
.logo{font-size:19px;font-weight:700;letter-spacing:-.02em;background:linear-gradient(135deg,#fb6208 0%,#d83f4d 25%,#a60db2 50%,#900ccf 75%,#3684ed 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.seg{display:flex;background:var(--chipBg);border-radius:9px;padding:2px;gap:2px;flex:none}
.seg button{padding:5px 12px;border:none;font-size:12px;border-radius:7px;background:none;color:var(--sub)}
.seg button.on{background:var(--panel);font-weight:600;color:var(--accent);box-shadow:0 1px 3px rgba(28,25,23,.1)}
.seg.sm button{padding:3px 9px;font-size:11px;border-radius:6px}
.seg.sm button.on{color:var(--text)}
.pill{display:flex;align-items:center;gap:6px;padding:5px 10px;border:1px solid var(--border2);border-radius:20px;font-size:11px;font-weight:600;flex:none;background:var(--panel);color:var(--sub)}
.pill.on{background:#e7f6ef;border-color:#c4e8d6;color:#0a6e4f}
.searchwrap{position:relative;flex:1;max-width:420px}
.searchwrap input{width:100%;box-sizing:border-box;padding:8px 12px 8px 32px;border:1px solid var(--border2);border-radius:8px;font:inherit;font-size:13px;background:var(--inputBg);color:var(--text);outline:none}
.searchwrap svg{position:absolute;left:10px;top:9px;width:14px;height:14px}
.dd{position:absolute;top:40px;left:0;right:0;background:var(--panel);border:1px solid var(--border2);border-radius:10px;box-shadow:0 12px 32px rgba(28,25,23,.12);overflow:hidden;animation:fadeIn .15s ease}
.dd button{display:flex;align-items:baseline;gap:8px;width:100%;text-align:left;padding:9px 12px;border:none;background:none;font-size:13px;border-bottom:1px solid var(--chipBg);color:var(--text)}
.dd button:hover{background:var(--accentBg)}
.dd b{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:260px}
.dd .sub{font-size:11.5px;color:var(--faint);font-family:ui-monospace,Menlo,monospace;flex:none}
.gochip{display:flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;color:#0a6e4f;background:#e7f6ef;border:1px solid #c4e8d6;padding:4px 6px 4px 10px;border-radius:20px;max-width:280px}
.gochip span.t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gochip button{border:none;background:#c4e8d6;color:#0a6e4f;width:18px;height:18px;border-radius:50%;font-size:11px;line-height:1;flex:none;padding:0}
aside{border-right:1px solid var(--border);background:var(--panel);display:flex;flex-direction:column;overflow:hidden;min-width:0;white-space:nowrap}
.side-title{padding:14px 16px 8px;font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--faint)}
.side-rows{flex:1;overflow-y:auto;padding:0 8px 8px;display:flex;flex-direction:column;gap:1px}
.row{display:flex;align-items:center;gap:9px;padding:6px 8px;border:none;border-radius:8px;background:none;color:var(--text2);width:100%}
.row:hover{background:var(--hoverbg)}
.row.on{background:var(--accentBg);color:var(--accent)}
.row .dot{width:9px;height:9px;border-radius:50%;flex:none}
.row .nm{font-size:13px;font-weight:500;width:68px;text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .bar{flex:1;height:4px;border-radius:2px;background:var(--track);overflow:hidden}
.row .bar i{display:block;height:100%;border-radius:2px}
.row .ct{font-size:11.5px;color:var(--faint);font-family:ui-monospace,Menlo,monospace;width:26px;text-align:right}
.legend{border-top:1px solid var(--track);padding:12px 16px;display:flex;flex-direction:column;gap:8px}
.legend .lt{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--faint)}
.legend .ld{display:flex;align-items:center;gap:14px}
.legend .ld span{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--sub)}
.legend .ld i{border-radius:50%;background:var(--sub)}
main{position:relative;overflow:hidden}
main svg.map{width:100%;height:100%;display:block}
circle.pt{transition:cx .8s cubic-bezier(.22,1,.36,1),cy .8s cubic-bezier(.22,1,.36,1),r .8s cubic-bezier(.22,1,.36,1),opacity .45s ease}
.lbl{position:absolute;font-weight:600;text-shadow:0 0 4px var(--bg),0 0 4px var(--bg),0 0 5px var(--bg);cursor:pointer;user-select:none;z-index:5;transition:font-size .15s,color .3s}
.chipbar{position:absolute;top:16px;left:16px;z-index:10;display:flex;align-items:center;gap:10px;animation:fadeIn .3s ease}
.backbtn{display:flex;align-items:center;gap:6px;padding:7px 12px;border:1px solid var(--border2);border-radius:8px;background:var(--panel);font-size:12.5px;font-weight:500;color:var(--sub2);box-shadow:0 2px 6px rgba(28,25,23,.06)}
.backbtn:hover{border-color:var(--accentBorder);color:var(--accent)}
.mini{position:absolute;left:16px;right:16px;bottom:14px;z-index:10;background:var(--panelGlass);backdrop-filter:blur(6px);border:1px solid var(--border);border-radius:10px;padding:10px 14px 6px;animation:fadeIn .3s ease}
.mini .mh{display:flex;justify-content:space-between;font-size:10.5px;color:var(--faint);font-family:ui-monospace,Menlo,monospace;margin-bottom:4px}
.tip{position:fixed;background:#1c1917;color:#fff;padding:7px 10px;border-radius:8px;pointer-events:none;z-index:50;white-space:nowrap;box-shadow:0 8px 20px rgba(0,0,0,.25);transform:translate(-50%,-130%);display:none}
.tip .t1{font-weight:600;font-size:12.5px}.tip .t2{font-size:11px;color:#c7c2bc;font-family:ui-monospace,Menlo,monospace}
.card{position:absolute;top:16px;right:16px;z-index:20;width:430px;max-height:calc(100% - 32px);overflow-y:auto;background:var(--panel);border:1px solid var(--border);border-radius:14px;box-shadow:0 24px 60px rgba(28,25,23,.18);animation:cardIn .35s cubic-bezier(.22,1,.36,1)}
.card .hd{padding:14px 16px 12px;display:flex;align-items:flex-start;gap:10px;border-bottom:1px solid var(--chipBg)}
.badge{font-size:11px;font-weight:600;padding:2px 8px;border-radius:20px;color:#fff}
.xbtn{border:none;background:var(--chipBg);color:var(--sub);width:26px;height:26px;border-radius:8px;font-size:14px;line-height:1}
.xbtn:hover{background:var(--accentBorder);color:var(--accent)}
.tabs{display:flex;gap:2px;padding:10px 16px 0}
.tabs button{padding:7px 12px;border:none;background:none;font-size:12.5px;border-radius:8px 8px 0 0;color:var(--sub)}
.tabs button.on{font-weight:600;color:var(--accent);background:var(--accentBg)}
.kv{border-top:1px solid var(--chipBg);background:var(--panel2);padding:12px 16px;display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px 14px}
.kv .k{font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);font-weight:600}
.kv .v{font-size:12.5px;font-weight:600;margin-top:2px}.kv .vm{font-size:12px;font-family:ui-monospace,Menlo,monospace;margin-top:2px}
.gbar{display:grid;grid-template-columns:160px 1fr 44px;gap:8px;align-items:center}
.gbar .gt{font-size:11px;color:var(--sub2);line-height:1.25;text-align:right;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.gbar .gk{height:14px;background:var(--chipBg);border-radius:3px;overflow:hidden}
.gbar .gk i{display:block;height:100%;border-radius:3px;background:linear-gradient(90deg,#a60db2,#d83f4d)}
.gbar .gv{font-size:10.5px;font-family:ui-monospace,Menlo,monospace;color:var(--sub)}
.gtbl{margin-top:8px;border:1px solid var(--border);border-radius:8px;overflow:hidden}
.gtr{display:grid;grid-template-columns:1fr 52px 62px 46px;gap:6px;padding:6px 10px;align-items:baseline;border-top:1px solid var(--chipBg)}
.gtr.h{background:var(--hoverbg);font-size:10px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--faint);border-top:none}
.gtr span{font-size:10.5px;font-family:ui-monospace,Menlo,monospace;text-align:right;color:var(--sub2)}
.gtr .d{font-size:11px;color:var(--text2);line-height:1.3;font-family:'Instrument Sans',system-ui,sans-serif;text-align:left}
.gtr .d em{font-style:normal;font-size:9.5px;color:var(--faint);font-family:ui-monospace,Menlo,monospace}
.genechip{font-size:11.5px;font-weight:600;font-family:ui-monospace,Menlo,monospace;color:var(--text2);background:var(--chipBg);border:1px solid var(--border);padding:3px 9px;border-radius:14px;display:inline-flex;align-items:center;gap:4px}
.genechip:hover{color:var(--accent);border-color:var(--accentBorder);background:var(--accentBg)}
.genechip i{font-style:normal;font-size:9px;opacity:.55}
.loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:13px;color:var(--faint);font-family:ui-monospace,Menlo,monospace}
.linkbtn{border:none;background:none;font-size:11.5px;font-weight:600;color:var(--accent);padding:0}
.zbtn{border:1px solid var(--border2);background:var(--panel);color:var(--sub2);border-radius:6px;width:22px;height:22px;font-size:12px;line-height:1;padding:0}
</style>
</head>
<body>
<div class="app" id="app">
  <header>
    <button class="iconbtn" id="sidebtn" title="Toggle sidebar"><svg viewBox="0 0 16 16" width="14" height="14"><rect x="1.5" y="2.5" width="13" height="11" rx="2" fill="none" stroke="currentColor" stroke-width="1.4"/><line x1="6" y1="2.5" x2="6" y2="13.5" stroke="currentColor" stroke-width="1.4"/></svg></button>
    <div style="display:flex;align-items:baseline;gap:10px"><div class="logo">JAGUAR</div><div style="font-size:13px;font-weight:500;color:var(--sub)">CCAN Explorer</div></div>
    <div class="seg" id="viewseg"><button data-v="genome" class="on">Genome</button><button data-v="topic">Clusters</button></div>
    <div style="display:flex;align-items:center;gap:6px;flex:none" id="colorwrap"><span style="font-size:11px;color:var(--faint);font-weight:600">Color</span><div class="seg sm" id="colorseg"><button data-c="chr" class="on">chr</button><button data-c="topic">cluster</button></div></div>
    <button class="pill" id="gobtn" title="Dim CCANs without GO enrichment">GO terms only</button>
    <div class="searchwrap">
      <input id="q" placeholder="Search CCAN, chromosome, gene, or GO term" autocomplete="off">
      <svg viewBox="0 0 16 16"><circle cx="7" cy="7" r="5" fill="none" stroke="#a8a29e" stroke-width="1.6"/><line x1="11" y1="11" x2="15" y2="15" stroke="#a8a29e" stroke-width="1.6"/></svg>
      <div class="dd" id="dd" style="display:none"></div>
    </div>
    <div style="margin-left:auto;display:flex;align-items:center;gap:8px">
      <div class="gochip" id="gochip" style="display:none"><span class="t" id="gochipT"></span><span style="font-family:ui-monospace,Menlo,monospace;flex:none" id="gochipN"></span><button id="gochipX">✕</button></div>
      <button class="iconbtn" id="darkbtn" title="Toggle dark mode">☾</button>
      <div style="font-size:12px;color:var(--sub)"><b style="color:var(--text)" id="total">—</b> CCANs</div>
      <div style="font-size:11px;font-weight:600;color:var(--accent);background:var(--accentBg);border:1px solid var(--accentBorder);padding:3px 8px;border-radius:20px">hg38</div>
    </div>
  </header>
  <aside>
    <div class="side-title" id="sideTitle">Chromosomes</div>
    <div class="side-rows" id="sideRows"></div>
    <div class="legend"><div class="lt">Point size = peaks</div><div class="ld"><span><i style="width:5px;height:5px"></i>3</span><span><i style="width:9px;height:9px"></i>50</span><span><i style="width:15px;height:15px"></i>250</span></div></div>
  </aside>
  <main id="main">
    <div class="loading" id="loading">loading ccan_index.json…</div>
    <svg class="map" viewBox="0 0 1200 800" preserveAspectRatio="xMidYMid meet">
      <defs><filter id="blobBlur" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="16"/></filter></defs>
      <g id="blobs"></g><g id="pts"></g><g id="hits"></g>
    </svg>
    <div id="labels"></div>
    <div class="chipbar" id="chipbar" style="display:none"><button class="backbtn" id="backbtn">←</button><div style="font-size:13px;color:var(--sub)"><b style="color:var(--text)" id="chipName"></b> · <span id="chipCount"></span> CCANs</div></div>
    <div class="mini" id="mini" style="display:none"><div class="mh"><span id="miniL"></span><span id="miniR"></span></div><svg viewBox="0 0 1000 34" preserveAspectRatio="none" style="width:100%;height:34px;display:block"><rect x="0" y="12" width="1000" height="12" rx="6" fill="var(--track)"/><g id="miniG"></g></svg></div>
    <div class="tip" id="tip"><div class="t1" id="tip1"></div><div class="t2" id="tip2"></div></div>
    <div class="card" id="card" style="display:none"></div>
  </main>
</div>
<script>
'use strict';
const CHR_LEN={chr1:248956422,chr2:242193529,chr3:198295559,chr4:190214555,chr5:181538259,chr6:170805979,chr7:159345973,chr8:145138636,chr9:138394717,chr10:133797422,chr11:135086622,chr12:133275309,chr13:114364328,chr14:107043718,chr15:101991189,chr16:90338345,chr17:83257441,chr18:80373285,chr19:58617616,chr20:64444167,chr21:46709983,chr22:50818468,chrX:156040895,chrY:57227415};
const CHR_ORDER=['chr1','chr2','chr3','chr4','chr5','chr6','chr7','chr8','chr9','chr10','chr11','chr12','chr13','chr14','chr15','chr16','chr17','chr18','chr19','chr20','chr21','chr22','chrX','chrY'];
const DISPERSION=0.6;
const S={data:null,go:null,genes:null,view:'genome',colorBy:'chr',focusChr:null,focusCluster:null,sel:null,tab:'plot',rank:'p',goExpanded:false,goFilter:null,hasGoOnly:false,hoverRow:null,dark:false};
const $=id=>document.getElementById(id);
const fmt=n=>typeof n==='number'?n.toLocaleString('en-US'):'—';
const fmtSize=kb=>kb>=1000?(kb/1000).toFixed(2)+' Mb':kb.toFixed(1)+' kb';
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function rng(seed){let a=(seed>>>0)||1;return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const chrColor=i=>`oklch(0.60 0.15 ${(i*137.508)%360})`;
const chrColorSoft=i=>`oklch(0.75 0.10 ${(i*137.508)%360})`;
const clusterColor=i=>i==null?'#c4beb6':`oklch(0.62 0.16 ${(i*137.508+80)%360})`;
const clusterColorDark=i=>`oklch(var(--lblL,0.44) 0.15 ${(i*137.508+80)%360})`;
let L=null,T=null,goIdx=null,geneIdx=null,byCcan=null;
const czCache={};
function genomeLayout(data){
  const r0=rng(42),W=1200,H=800;
  const chroms=CHR_ORDER.filter(ch=>data.some(d=>d.chromosome===ch));
  const counts={};data.forEach(d=>counts[d.chromosome]=(counts[d.chromosome]||0)+1);
  const clusters=chroms.map((ch,i)=>{const r=Math.min(78,16+Math.sqrt(counts[ch])*3.6);const ang=i*2.39996+(r0()-.5)*.9;const R=62*Math.sqrt(i+0.9);return{chr:ch,i,count:counts[ch],r,cx:600+R*Math.cos(ang),cy:400+R*Math.sin(ang)*0.72,angle:r0()*Math.PI,phase:r0()*Math.PI*2,color:chrColor(i)};});
  for(let it=0;it<160;it++){
    for(let a=0;a<clusters.length;a++)for(let b=a+1;b<clusters.length;b++){const A=clusters[a],B=clusters[b];let dx=B.cx-A.cx,dy=B.cy-A.cy,d=Math.hypot(dx,dy)||1;const min=A.r+B.r+14;if(d<min){const push=(min-d)/2;dx/=d;dy/=d;A.cx-=dx*push;A.cy-=dy*push;B.cx+=dx*push;B.cy+=dy*push;}}
    clusters.forEach(c=>{c.cx+=(600-c.cx)*0.004;c.cy+=(400-c.cy)*0.004;c.cx=Math.max(c.r+24,Math.min(W-c.r-24,c.cx));c.cy=Math.max(c.r+34,Math.min(H-c.r-24,c.cy));});
  }
  const byChr={};clusters.forEach(c=>byChr[c.chr]=c);
  const pts=data.map(d=>{const cl=byChr[d.chromosome];if(!cl)return null;const rr=rng(d.ccan*2654435761);const g1=rr()+rr()+rr()-1.5,g2=rr()+rr()+rr()-1.5;const t=Math.min(1,((d.start+d.end)/2)/CHR_LEN[d.chromosome]);const len=cl.r*2.15,wid=cl.r*1.05;const dAxis=(t-.5)*len+g2*len*.07*DISPERSION;const perp=Math.sin(t*Math.PI*2.6+cl.phase)*wid*.28+g1*wid*.34*DISPERSION;const ca=Math.cos(cl.angle),sa=Math.sin(cl.angle);return{d,cluster:cl,gx:cl.cx+dAxis*ca-perp*sa,gy:cl.cy+dAxis*sa+perp*ca,gr:1.9+Math.sqrt(d.n_peaks)*.40,jy:g1};}).filter(Boolean);
  return{clusters,byChr,pts};
}
function topicLayout(data){
  const withU=data.filter(d=>d.umap1!=null);
  const xs=withU.map(d=>d.umap1),ys=withU.map(d=>d.umap2);
  const minX=Math.min(...xs),maxX=Math.max(...xs),minY=Math.min(...ys),maxY=Math.max(...ys);
  const s=Math.min(1020/((maxX-minX)||1),620/((maxY-minY)||1));
  const ox=(1200-s*(maxX-minX))/2,oy=(800-s*(maxY-minY))/2+15;
  const pos=new Map(),agg={};
  withU.forEach(d=>{const x=ox+(d.umap1-minX)*s,y=800-(oy+(d.umap2-minY)*s);pos.set(d.ccan,{x,y});const c=d.leiden_cluster;if(c!=null){if(!agg[c])agg[c]={sx:0,sy:0,n:0};agg[c].sx+=x;agg[c].sy+=y;agg[c].n++;}});
  const clusters=Object.keys(agg).map(Number).sort((a,b)=>a-b).map(id=>({id,count:agg[id].n,cx:agg[id].sx/agg[id].n,cy:agg[id].sy/agg[id].n,color:clusterColor(id)}));
  return{pos,clusters};
}
function clusterZoom(cid){
  if(czCache[cid])return czCache[cid];
  const pts=S.data.filter(d=>d.leiden_cluster===cid&&d.umap1!=null);
  const xs=pts.map(d=>d.umap1),ys=pts.map(d=>d.umap2);
  const minX=Math.min(...xs),maxX=Math.max(...xs),minY=Math.min(...ys),maxY=Math.max(...ys);
  const midX=(minX+maxX)/2,midY=(minY+maxY)/2;
  const s=Math.min(940/((maxX-minX)||1e-6),500/((maxY-minY)||1e-6));
  const pos=new Map();
  pts.forEach(d=>pos.set(d.ccan,{x:600+(d.umap1-midX)*s,y:385-(d.umap2-midY)*s}));
  return czCache[cid]=pos;
}
function zoomPos(pt,chrPts){
  const starts=chrPts.map(p=>p.d.start),ends=chrPts.map(p=>p.d.end);
  const minS=Math.min(...starts),maxE=Math.max(...ends),span=Math.max(1,maxE-minS);
  const t=(((pt.d.start+pt.d.end)/2)-minS)/span;
  const x=90+t*1020;
  const y=385+Math.sin(t*Math.PI*2.2+pt.cluster.phase)*62+pt.jy*105*DISPERSION;
  return{x,y:Math.max(110,Math.min(620,y)),r:4.2+Math.sqrt(pt.d.n_peaks)*1.05};
}
function toScreen(x,y){const m=$('main');const w=m.clientWidth||900,h=m.clientHeight||700;const s=Math.min(w/1200,h/800);return{x:(w-1200*s)/2+x*s,y:(h-800*s)/2+y*s};}
const hasGo=d=>S.go?Object.prototype.hasOwnProperty.call(S.go,d.ccan):d.is_great_significant;

// ---------- circles (built once, styled per state) ----------
const circleByCcan=new Map();
function buildCircles(){
  const g=$('pts');
  const frag=document.createDocumentFragment();
  L.pts.forEach(pt=>{
    const c=document.createElementNS('http://www.w3.org/2000/svg','circle');
    c.setAttribute('class','pt');
    c.addEventListener('mouseenter',e=>ptHover(pt,e));
    c.addEventListener('mousemove',e=>ptHover(pt,e));
    c.addEventListener('mouseleave',hideTip);
    c.addEventListener('click',e=>{e.stopPropagation();ptClick(pt);});
    circleByCcan.set(pt.d.ccan,c);
    frag.appendChild(c);
  });
  g.appendChild(frag);
}
function ptHover(pt,e){
  const d=pt.d;
  showTip(e,'CCAN '+d.ccan,`${d.chromosome}:${fmt(d.start)}–${fmt(d.end)} · ${d.n_peaks} peaks`+(S.view==='topic'&&d.leiden_cluster!=null?` · cluster ${d.leiden_cluster}`:''));
}
function ptClick(pt){
  const d=pt.d;
  if(S.view==='topic'&&S.focusCluster==null){S.focusCluster=d.leiden_cluster??null;S.sel=null;hideTip();update();return;}
  select(d);
}
function select(d){
  S.sel=d;
  if(S.view==='genome')S.focusChr=d.chromosome;else S.focusCluster=d.leiden_cluster??null;
  S.tab=S.tab||'plot';S.goExpanded=false;hideTip();$('q').value='';$('dd').style.display='none';
  update();
}
function updatePoints(){
  const gset=S.goFilter?S.goFilter.set:null;
  const focusPts=S.view==='genome'&&S.focusChr?L.pts.filter(p=>p.d.chromosome===S.focusChr):null;
  const czoom=S.view==='topic'&&S.focusCluster!=null?clusterZoom(S.focusCluster):null;
  L.pts.forEach(pt=>{
    const d=pt.d,el=circleByCcan.get(d.ccan);
    let x,y,r,op,interactive,fill;
    if(S.view==='genome'){
      x=pt.gx;y=pt.gy;r=pt.gr;op=0.85;
      const isF=d.chromosome===S.focusChr;
      if(S.focusChr){if(isF){const z=zoomPos(pt,focusPts);x=z.x;y=z.y;r=z.r;op=0.92;}else op=0;}
      else if(S.hoverRow!=null)op=d.chromosome===S.hoverRow?1:0.12;
      if(gset&&op>0)op=gset.has(d.ccan)?Math.max(op,0.95):0.05;
      if(S.hasGoOnly&&op>0)op=hasGo(d)?Math.max(op,0.92):Math.min(op,0.07);
      interactive=S.focusChr&&isF&&op>0.1;
      fill=S.colorBy==='topic'?clusterColor(d.leiden_cluster):pt.cluster.color;
    }else{
      const p0=T.pos.get(d.ccan);
      const inF=S.focusCluster!=null&&d.leiden_cluster===S.focusCluster;
      const p=inF&&czoom?czoom.get(d.ccan):p0;
      op=0.85;r=p0?2.2+Math.sqrt(d.n_peaks)*.45:pt.gr;
      if(!p0)op=0;
      else if(S.focusCluster!=null){if(inF){op=0.92;r=4.2+Math.sqrt(d.n_peaks)*1.05;}else op=0;}
      else if(S.hoverRow!=null)op=d.leiden_cluster===S.hoverRow?1:0.1;
      if(op>0){if(gset)op=gset.has(d.ccan)?Math.max(op,0.95):0.05;if(S.hasGoOnly)op=hasGo(d)?Math.max(op,0.92):Math.min(op,0.07);}
      x=p?p.x:pt.gx;y=p?p.y:pt.gy;
      interactive=!!p0&&op>0.1;
      fill=clusterColor(d.leiden_cluster);
    }
    const isSel=S.sel&&S.sel.ccan===d.ccan;
    el.setAttribute('fill',fill);
    el.setAttribute('stroke',isSel?'#1c1917':'none');
    el.setAttribute('stroke-width',isSel?2:0);
    const st=el.style;st.cx=x+'px';st.cy=y+'px';st.r=r+'px';st.opacity=op;st.cursor=interactive?'pointer':'default';st.pointerEvents=interactive?'auto':'none';
  });
}

$('q').addEventListener('input',()=>{
  const q=$('q').value.trim().toLowerCase();
  const dd=$('dd');
  if(!q||!S.data){dd.style.display='none';return;}
  let res=[];
  if(/^\d+$/.test(q)){
    res=S.data.filter(d=>String(d.ccan).startsWith(q)).slice(0,8).map(d=>({label:'CCAN '+d.ccan,sub:`${d.chromosome}:${fmt(d.start)}–${fmt(d.end)}`,go:()=>select(d)}));
  }else{
    res=L.clusters.filter(c=>c.chr.includes(q)).slice(0,4).map(c=>({label:c.chr,sub:c.count+' CCANs',go:()=>{S.view='genome';S.focusChr=c.chr;S.focusCluster=null;S.sel=null;$('q').value='';syncSeg();update();}}));
    if(geneIdx&&q.length>=2){
      const gm=geneIdx.filter(t=>t.sym.toLowerCase().startsWith(q)).sort((a,b)=>a.sym.localeCompare(b.sym)).slice(0,4);
      for(const t of gm)for(const cc of t.ccans.slice(0,3)){const d=byCcan.get(cc);if(d)res.push({label:t.sym+' · CCAN '+cc,sub:`${d.chromosome}:${fmt(d.start)}–${fmt(d.end)}`,go:()=>select(d)});}
    }
    if(goIdx&&q.length>=3&&res.length<8){
      const hits=goIdx.filter(t=>t.desc.toLowerCase().includes(q)).sort((a,b)=>b.ccans.size-a.ccans.size).slice(0,8-res.length);
      res=res.concat(hits.map(t=>({label:t.desc,sub:t.ccans.size+' CCANs',go:()=>{S.goFilter={term:t.desc,set:t.ccans};$('q').value='';$('dd').style.display='none';update();}})));
    }
  }

});

$('gobtn').addEventListener('click',()=>{S.hasGoOnly=!S.hasGoOnly;update();});
$('gochipX').addEventListener('click',()=>{S.goFilter=null;update();});
$('sidebtn').addEventListener('click',()=>{$('app').classList.toggle('closed');[80,160,240,320,420].forEach(t=>setTimeout(()=>renderOverlay(),t));});
$('darkbtn').addEventListener('click',()=>{S.dark=!S.dark;document.body.classList.toggle('dark',S.dark);$('darkbtn').textContent=S.dark?'☀':'☾';try{localStorage.setItem('jaguarDark',S.dark?'1':'0');}catch(e){}});
$('backbtn').addEventListener('click',e=>{e.stopPropagation();S.focusChr=null;S.focusCluster=null;S.sel=null;update();});
$('main').addEventListener('click',()=>{if(S.sel)S.sel=null;else{S.focusChr=null;S.focusCluster=null;}update();});
$('mini').addEventListener('click',e=>e.stopPropagation());
window.addEventListener('resize',()=>{if(L)renderOverlay();});
// ---------- master update ----------
function update(){if(!S.data)return;syncSeg();renderSide();updatePoints();renderOverlay();renderChip();renderMini();renderCard();}
</script>
</body>
</html>
